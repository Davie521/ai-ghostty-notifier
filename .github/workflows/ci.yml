name: CI

# macOS native runtime, plus /bin/bash 3.2-compatible bootstrap/install glue.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure shellcheck and test-only jq
        run: |
          command -v shellcheck >/dev/null 2>&1 || brew install shellcheck
          command -v jq >/dev/null 2>&1 || brew install jq
          shellcheck --version | sed -n '1,2p'
          jq --version

      - name: Bash syntax check
        run: |
          for f in hooks/*.sh install.sh tests/*.sh scripts/*.sh; do
            bash -n "$f"
            echo "  ok  $f"
          done

      - name: ShellCheck
        # --severity=warning skips info/style noise (e.g. SC1003 on the
        # intentional OSC 2 String Terminator) while still failing on any
        # warning or error.
        run: shellcheck --severity=warning hooks/*.sh install.sh tests/*.sh scripts/*.sh

      - name: Validate JSON
        run: |
          for j in hooks/hooks.json example-settings.json .claude-plugin/*.json; do
            jq empty "$j"
            echo "  ok  $j"
          done

      - name: Historical shell behavior fixtures (not native runtime coverage)
        run: |
          bash tests/test-alerter-dispatch.sh
          bash tests/test-fallback-no-focus.sh
          bash tests/test-session-title.sh
          bash tests/test-clear-on-focus.sh

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Historical Codex fixtures and installer config regressions
        run: python3 -m unittest discover -s tests -p 'test_codex_hooks.py' -v

      # The native bundle is required. Swift failures fail the product gate;
      # historical fixtures above are comparisons, never a runtime fallback.
      - name: Swift toolchain
        run: swift --version

      - name: NotifyCore unit tests
        run: swift test --package-path agent --quiet

      - name: Build and verify required native bundle without installing it
        run: |
          bash scripts/build-agent.sh --build-only
          codesign --verify --deep --strict build/ClaudeGhosttyNotify.app

      - name: Native launchers and real process regressions
        env:
          NATIVE_TEST_BINARY: ${{ github.workspace }}/build/ClaudeGhosttyNotify.app/Contents/MacOS/ghostty-notify-agent
        run: python3 -m unittest discover -s tests -p 'test_native_hooks.py' -v

      - name: Isolated first install and upgrade regressions
        run: python3 -m unittest discover -s tests -p 'test_native_install.py' -v

      # Skips itself with a loud SKIP line when the runner has no Aqua session,
      # because the agent is an AppKit app. It never asserts that a banner
      # appeared — that needs an authorization grant only a human can give — so
      # the NotifyCore suites above stay the real gate.
      - name: Resident agent integration test
        run: bash tests/test-agent.sh
