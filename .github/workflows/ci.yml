name: CI

# macOS-only plugin, so CI runs on macOS: the hooks target /bin/bash 3.2 and
# BSD userland (stat -f, BSD date/find), which a Linux runner would not catch.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure shellcheck and jq
        run: |
          command -v shellcheck >/dev/null 2>&1 || brew install shellcheck
          command -v jq >/dev/null 2>&1 || brew install jq
          shellcheck --version | sed -n '1,2p'
          jq --version

      - name: Bash syntax check
        run: |
          for f in hooks/*.sh install.sh tests/*.sh scripts/*.sh; do
            bash -n "$f" && echo "  ok  $f"
          done

      - name: ShellCheck
        # --severity=warning skips info/style noise (e.g. SC1003 on the
        # intentional OSC 2 String Terminator) while still failing on any
        # warning or error.
        run: shellcheck --severity=warning hooks/*.sh install.sh tests/*.sh scripts/*.sh

      - name: Validate JSON
        run: |
          for j in hooks/hooks.json example-settings.json .claude-plugin/*.json; do
            jq empty "$j" && echo "  ok  $j"
          done

      - name: Regression tests
        run: |
          bash tests/test-fallback-no-focus.sh
          bash tests/test-session-title.sh
          bash tests/test-clear-on-prompt.sh

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Codex hook adapter and installer tests
        run: python3 -m unittest discover -s tests -p 'test_codex_hooks.py' -v

      # The resident agent is optional at runtime — every step above pins the
      # shell path, so a Swift failure here can never mask a shell regression.
      - name: Swift toolchain
        run: swift --version

      - name: NotifyCore unit tests
        run: swift test --package-path agent

      - name: Build resident agent bundle
        run: bash scripts/build-agent.sh

      # Skips itself with a loud SKIP line when the runner has no Aqua session,
      # because the agent is an AppKit app. It never asserts that a banner
      # appeared — that needs an authorization grant only a human can give — so
      # the NotifyCore suites above stay the real gate.
      - name: Resident agent integration test
        run: bash tests/test-agent.sh
