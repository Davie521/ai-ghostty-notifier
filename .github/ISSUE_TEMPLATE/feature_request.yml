name: Feature request
description: Something it should do, or do differently.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What gets in your way
      description: The situation, not the solution yet.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like instead
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried, or other tools that do it
